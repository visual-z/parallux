# XcodeGen spec. Everything Xcode needs is generated from this file by
# scripts/gen-xcodeproj.sh: the .xcodeproj, both Info.plist files and both
# entitlements files. None of them is committed; edit this file, never them.
# (XcodeGen rewrites an entitlements file from `properties` on every run and
# empties it when there are none, which is how M0 shipped empty ones.)
name: Parallux
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  ParalluxKit:
    path: ParalluxKit
# Both targets link Libbox.xcframework plus the system libraries its cronet
# (naive outbound) and usbip code need; found by linking.
targets:
  Parallux:
    type: application
    platform: macOS
    sources:
      - path: Parallux
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    entitlements:
      path: Parallux/Parallux.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [$(PARALLUX_NE_PROVIDER)]
        com.apple.security.application-groups: [$(PARALLUX_APP_GROUP)]
    info:
      path: Parallux/Info.plist
      properties:
        CFBundleDisplayName: Parallux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ParalluxAppGroup: $(PARALLUX_APP_GROUP)
        ParalluxTunnelMachService: $(PARALLUX_TUNNEL_MACH_SERVICE)
        ParalluxHelperMachService: $(PARALLUX_HELPER_MACH_SERVICE)
        ParalluxHelperLabel: $(PARALLUX_HELPER_LABEL)
        # parallux:// links (connect, servers, profiles) and SFM's sing-box://
        # import-remote-profile links.
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [parallux]
          - CFBundleURLName: $(BUNDLE_ID).sing-box-import
            CFBundleURLSchemes: [sing-box]
        # Sparkle. Empty in Base.xcconfig: the updater stays off.
        SUFeedURL: $(PARALLUX_UPDATE_FEED)
        SUPublicEDKey: $(PARALLUX_UPDATE_PUBLIC_KEY)
        ParalluxUpdateBetaFeed: $(PARALLUX_UPDATE_BETA_FEED)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ParalluxKit
      # Auto-update for Developer ID builds (PLAN decision 19). Sparkle 2.10.1,
      # fetched and sha256-checked by scripts/fetch-sparkle.sh; embedded and
      # signed with the app.
      - framework: Frameworks/Sparkle.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: libbsm.tbd
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: CoreText.framework
      - sdk: IOUSBHost.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - target: PacketTunnel
        embed: true
      # Widget and Control Center toggle.
      - target: ParalluxWidget
        embed: true
      # The root helper (PLAN decision 12): SMAppService.daemon runs the tool
      # named by the plist's BundleProgram, a path inside this bundle.
      - target: ParalluxHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/HelperTools
    postBuildScripts:
      # Expands the launchd plist template with this build's settings into
      # Contents/Library/LaunchDaemons/<label>.plist, where
      # SMAppService.daemon(plistName:) looks. Runs before signing (Xcode signs
      # the bundle last), so the plist is covered by the app's signature.
      - name: Embed helper launchd plist
        basedOnDependencyAnalysis: false
        inputFiles: [$(SRCROOT)/Config/helper-launchd.plist]
        outputFiles: [$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(PARALLUX_HELPER_LABEL).plist]
        script: |
          set -euo pipefail
          dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          mkdir -p "$dir"
          sed -e "s|\$(PARALLUX_HELPER_LABEL)|$PARALLUX_HELPER_LABEL|g" \
              -e "s|\$(PARALLUX_HELPER_MACH_SERVICE)|$PARALLUX_HELPER_MACH_SERVICE|g" \
              -e "s|\$(BUNDLE_ID)|$BUNDLE_ID|g" \
              "$SRCROOT/Config/helper-launchd.plist" > "$dir/$PARALLUX_HELPER_LABEL.plist"
          plutil -lint "$dir/$PARALLUX_HELPER_LABEL.plist" >/dev/null
  ParalluxHelper:
    type: tool
    platform: macOS
    sources: [ParalluxHelper]
    info:
      path: ParalluxHelper/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: Parallux Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ParalluxAppGroup: $(PARALLUX_APP_GROUP)
        ParalluxAppBundleID: $(BUNDLE_ID)
        ParalluxHelperMachService: $(PARALLUX_HELPER_MACH_SERVICE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARALLUX_HELPER_LABEL)
        PRODUCT_NAME: $(PARALLUX_HELPER_LABEL)
        PRODUCT_MODULE_NAME: ParalluxHelper
        ENABLE_HARDENED_RUNTIME: YES
        # A command-line tool has no bundle; its Info.plist is linked into the
        # binary's __TEXT,__info_plist so Bundle.main can read it.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: ParalluxKit
  # The widget reads the app's snapshot from the App Group; its Control
  # Center toggle starts and stops the VPN configuration directly, as SFM's
  # WidgetExtension does (no Libbox in this process).
  ParalluxWidget:
    type: app-extension
    platform: macOS
    sources: [ParalluxWidget]
    entitlements:
      path: ParalluxWidget/ParalluxWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(PARALLUX_APP_GROUP)]
        com.apple.developer.networking.networkextension: [$(PARALLUX_NE_PROVIDER)]
    info:
      path: ParalluxWidget/Info.plist
      properties:
        CFBundleDisplayName: Parallux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ParalluxAppGroup: $(PARALLUX_APP_GROUP)
        ParalluxAppBundleID: $(BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
        PRODUCT_NAME: ParalluxWidget
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: ParalluxKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: NetworkExtension.framework
  PacketTunnel:
    type: system-extension
    platform: macOS
    sources: [PacketTunnel]
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # sing-box dials and listens (DNS over UDP, rule-set downloads, tun
        # inbound) inside the sandbox; SFM's signed extension carries both.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension: [$(PARALLUX_NE_PROVIDER)]
        com.apple.security.application-groups: [$(PARALLUX_APP_GROUP)]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Parallux Tunnel
        CFBundlePackageType: SYSX
        # Required for network system extensions; SFM leaves it empty.
        NSSystemExtensionUsageDescription: ""
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ParalluxAppGroup: $(PARALLUX_APP_GROUP)
        ParalluxTunnelMachService: $(PARALLUX_TUNNEL_MACH_SERVICE)
        ParalluxHelperMachService: $(PARALLUX_HELPER_MACH_SERVICE)
        NetworkExtension:
          NEMachServiceName: $(PARALLUX_TUNNEL_MACH_SERVICE)
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tunnel
        PRODUCT_NAME: $(BUNDLE_ID).tunnel
        PRODUCT_MODULE_NAME: PacketTunnel
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: ParalluxKit
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: libbsm.tbd
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: CoreText.framework
      - sdk: IOUSBHost.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
schemes:
  Parallux:
    build:
      targets:
        Parallux: all
